name: Deploy to Server

on:
  push:
    branches: [ main ]  # Запускать при пуше в main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10  # Популярное действие для SSH
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/deploy/telegrambot
            git pull telegrambot main
            source ./venv/bin/activate
            pip install requirements.txt
            deactivate
            systemctl stop servicebot.service
            systemctl daemon-reload
            systemctl start servicebot.service
